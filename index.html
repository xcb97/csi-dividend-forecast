<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2129; --line:#2d333b;

  --accent:#58a6ff; --gold:#d29922; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  max-width:680px; margin:0 auto; padding-bottom:40px;
}
a{color:var(--accent);text-decoration:none}

/* ===== 顶部 ===== */
header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 16px 10px}
header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
header h1 .tag{font-size:10px;font-weight:400;color:var(--gold);border:1px solid var(--gold);
  border-radius:20px;padding:1px 8px;opacity:.9}
.meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.refresh{position:absolute;right:16px;top:14px;width:30px;height:30px;border-radius:8px;
  background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.refresh:active{transform:scale(.92)}

/* ===== 列表 ===== */
ul.list{list-style:none;padding:8px 10px}
li.item{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:transform .08s}
li.item:active{transform:scale(.98)}
.rank{width:26px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.rank.top{color:var(--gold);font-weight:700}
.stock{flex:1;min-width:0}
.stock .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock .cd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.num{text-align:right;flex-shrink:0}
.num .px{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.num .yl{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--red)} .dn{color:var(--green)}
.num .yl small{font-size:10px;font-weight:400;color:var(--muted)}
.chg{font-size:10px;margin-top:1px;font-variant-numeric:tabular-nums}
.arrow{color:var(--muted);font-size:18px;flex-shrink:0;opacity:.6}
.conf-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
.conf-h{background:var(--green)} .conf-m{background:var(--gold)} .conf-l{background:var(--muted)}
.nodata{color:var(--muted);font-size:12px}

/* ===== 加载与错误 ===== */
#loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px}
#loading .spin{display:inline-block;width:26px;height:26px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:10px;padding:16px}
.search{margin:10px 16px 4px;display:flex;gap:8px}
.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:8px 12px;font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;margin:10px 16px 2px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  color:var(--muted);padding:7px 0;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--card2);color:var(--text);border-color:var(--accent)}
</style>
</head>

/* ========= 实时行情: 腾讯 JSONP ========= */
const PRICE = {};   // code -> {price, chg}
function qtPrefix(c){
  if (/^(4|8|92)/.test(c)) return 'bj';
  if (/^[69]/.test(c)) return 'sh';
  return 'sz';
}
function fetchQuotes(){
  const codes = DATA.results.filter(r=>!r.error).map(r=>qtPrefix(r.code)+r.code);
  const chunk = 40; let done = 0;
  return new Promise(resolve=>{
    if(!codes.length) return resolve();
    let finished = 0;
    for(let i=0;i<codes.length;i+=chunk){
      const part = codes.slice(i,i+chunk);
      const cb = 'qtcb_'+i;
      window[cb] = function(data){
        try{
          const raw = data; // v_sh600036="..."  -> string
          if(typeof raw === 'string' && raw.indexOf('~')>0){
            const p = raw.split('~');
            if(p[2]){ PRICE[p[2]] = {price:parseFloat(p[3]), chg:parseFloat(p[32])}; }
          }
        }catch(e){}
        delete window[cb]; finished++;
        if(finished===Math.ceil(codes.length/chunk)) resolve();
      };
      const s = document.createElement('script');
      s.src = 'https://qt.gtimg.cn/q='+part.join(',')+'&callback='+cb;
      s.onerror = ()=>{delete window[cb]; finished++; if(finished===Math.ceil(codes.length/chunk)) resolve();};
      document.body.appendChild(s);
    }
  });
}

/* ========= 渲染 ========= */
let sortKey = 'yield', kw = '';
const $list = document.getElementById('list');
const fmt = (v,d=2)=> v==null?'-':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});

function rows(){
  let arr = DATA.results.filter(r=>!r.error);
  if(kw) arr = arr.filter(r=> r.name.includes(kw) || r.code.includes(kw));
  const yieldOf = r=>{
    const q = PRICE[r.code];
    const price = q ? q.price : r.price;
    if(!price || !r.dps_pred) return null;
    return r.dps_pred/price*100;
  };
  if(sortKey==='yield') arr.sort((a,b)=>(yieldOf(b)||-1)-(yieldOf(a)||-1));
  else if(sortKey==='mkt') arr.sort((a,b)=>(b.mktcap_yi||0)-(a.mktcap_yi||0));
  else arr.sort((a,b)=>(b.dps_pred||0)-(a.dps_pred||0));
  return arr.map(r=>({r, y:yieldOf(r)}));
}

function render(){
  const data = rows();
  document.getElementById('mCnt').textContent = `${data.length} 只`;
  const now = new Date();
  document.getElementById('mTime').textContent =
    `行情 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let html = '';
  data.forEach(({r,y},i)=>{
    const q = PRICE[r.code];
    const price = q?q.price:r.price;
    const chg = q?q.chg:null;
    const chgCls = chg==null?'':(chg>=0?'up':'dn');
    const yTxt = y==null?'<span class="nodata">亏损/无</span>':y.toFixed(2)+'<small>%</small>';
    const yCls = y==null?'':(y>=5?'up':(y>=3.5?'':'dn'));
    html += `<li class="item" data-code="${r.code}">
      <div class="rank ${i<3?'top':''}">${i+1}</div>
      <div class="stock">
        <div class="nm"><span class="conf-dot conf-${r.confidence==='高'?'h':(r.confidence==='中'?'m':'l')}"></span>${r.name}</div>
        <div class="cd">${r.code}${r.flag?' · 利润剧变':''}</div>
      </div>
      <div class="num">
        <div class="px ${chgCls}">${price?fmt(price):'-'}</div>
        <div class="chg ${chgCls}">${chg==null?'':(chg>=0?'+':'')+chg.toFixed(2)+'%'}</div>
      </div>
      <div class="num">
        <div class="yl ${yCls}">${yTxt}</div>
        <div class="chg" style="color:var(--muted)">预测股息率</div>
      </div>
      <div class="arrow">›</div>
    </li>`;
  });
  $list.innerHTML = html;
  $list.querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>{ location.href = 'detail.html?code='+el.dataset.code; };
  });
}

/* ========= 初始化 ========= */
document.getElementById('yearTag').textContent = DATA.year+'预测';
document.getElementById('mDate').textContent = '数据 '+DATA.date;
document.getElementById('btnRefresh').onclick = async e=>{
  e.target.style.transition='transform .6s'; e.target.style.transform='rotate(360deg)';
  setTimeout(()=>{e.target.style.transition='';e.target.style.transform='';},650);
  await fetchQuotes(); render();
};
document.getElementById('q').oninput = e=>{ kw=e.target.value.trim(); render(); };
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); sortKey=b.dataset.k; render();
  };
});
document.getElementById('loading').style.display='none';
fetchQuotes().then(render);
setTimeout(render, 50);
</script>
